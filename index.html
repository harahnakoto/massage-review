<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>美體評價小幫手😏</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=DM+Serif+Display&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0e0c14;
    --bg2: #13101c;
    --bg3: #1c1828;
    --card: #181424;
    --border: rgba(180,160,255,0.1);
    --border2: rgba(180,160,255,0.2);
    --text: #ede8f8;
    --text2: #9d8fc4;
    --text3: #5a5070;
    --gold: #b89af0;
    --gold2: #d4bcff;
    --green: #7ec8a0;
    --green-bg: rgba(126,200,160,0.12);
    --amber: #c4a05a;
    --amber-bg: rgba(196,160,90,0.12);
    --red: #c47a9a;
    --red-bg: rgba(196,122,154,0.12);
    --radius: 14px;
    --radius-sm: 8px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html { background: var(--bg); }
  body {
    font-family: 'Noto Sans TC', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    max-width: 480px;
    margin: 0 auto;
    padding-bottom: 80px;
  }

  /* Header */
  .header {
    position: sticky; top: 0; z-index: 100;
    background: rgba(14,12,20,0.94);
    backdrop-filter: blur(12px);
    border-bottom: 0.5px solid var(--border);
    padding: 16px 20px 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .header-left { flex: 1; }
  .header-title {
    font-family: 'DM Serif Display', serif;
    font-size: 22px;
    letter-spacing: 0.02em;
    color: var(--gold2);
    line-height: 1;
  }
  .header-sub { font-size: 11px; color: var(--text3); margin-top: 3px; letter-spacing: 0.05em; }

  /* Google Sync Status UI */
  .sync-container { font-size: 11px; text-align: right; }
  .sync-btn {
    background: #4285f4; color: white; border: none; padding: 6px 10px;
    border-radius: var(--radius-sm); font-size: 11px; cursor: pointer; font-weight: 500;
  }
  .sync-btn:active { opacity: 0.9; }
  .sync-status { color: var(--green); display: flex; align-items: center; gap: 4px; justify-content: flex-end; }
  .sync-status.off { color: var(--text3); }
  .sync-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

  /* Bottom nav */
  .bottom-nav {
    position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
    width: 100%; max-width: 480px;
    background: rgba(14,12,20,0.97);
    backdrop-filter: blur(16px);
    border-top: 0.5px solid var(--border);
    display: flex;
    z-index: 100;
  }
  .nav-btn {
    flex: 1; padding: 12px 4px 14px;
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    background: none; border: none; color: var(--text3); cursor: pointer;
    font-size: 10px; font-family: 'Noto Sans TC', sans-serif;
    transition: color 0.15s;
  }
  .nav-btn.active { color: var(--gold2); }
  .nav-icon { font-size: 20px; line-height: 1; }

  /* Pages */
  .page { display: none; padding: 16px 16px 0; animation: fadeIn 0.2s ease; }
  .page.active { display: block; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  /* Cards */
  .card {
    background: var(--card);
    border: 0.5px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 16px;
    margin-bottom: 10px;
  }
  .card-title { font-size: 14px; font-weight: 500; color: var(--text2); margin-bottom: 12px; letter-spacing: 0.03em; }

  /* Therapist list card */
  .therapist-card {
    background: var(--card);
    border: 0.5px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 16px;
    margin-bottom: 10px;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
  }
  .therapist-card:active { background: var(--bg3); border-color: var(--border2); }
  .th-header { display: flex; align-items: center; gap: 12px; }
  .avatar {
    width: 46px; height: 46px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 15px; font-weight: 700; flex-shrink: 0;
    border: 1.5px solid rgba(255,255,255,0.1);
  }
  .av0 { background: #1a1e2e; color: #7ea8e0; }
  .av1 { background: #221a30; color: #c49af0; }
  .av2 { background: #2a1a28; color: #e08ab8; }
  .av3 { background: #1a2624; color: #7ec8b0; }
  .av4 { background: #28201a; color: #e0b87a; }
